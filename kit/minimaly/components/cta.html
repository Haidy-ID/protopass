<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Call to action</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../ds.css">
  <link rel="stylesheet" href="../../playground/specimen.css">
</head>
<body>
  <div class="specimen" style="grid-template-columns: minmax(0, 1fr)">
    <span class="row">Default</span>
    <div class="cta">
      <div class="cta__body"><h2 class="text" data-variant="heading">Ready when you are</h2><p class="cta__text">Free for three people. No card, no setup call.</p></div>
      <div class="cta__actions"><a class="btn" data-variant="primary" data-size="lg" href="#">Start free</a><a class="btn" data-size="lg" href="#">Talk to us</a></div>
    </div>
    <span class="row">Inverted</span>
    <div class="cta" data-variant="inverted">
      <div class="cta__body"><h2 class="text" data-variant="heading">Ready when you are</h2><p class="cta__text">Free for three people. No card, no setup call.</p></div>
      <div class="cta__actions"><a class="btn" data-variant="primary" data-size="lg" href="#">Start free</a><a class="btn" data-size="lg" href="#">Talk to us</a></div>
    </div>
  </div>
  <script src="../ds.js"></script>
</body>
</html>
