<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Save status</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../ds.css">
  <link rel="stylesheet" href="../../playground/specimen.css">
</head>
<body>
  <div class="specimen" style="--cols: 3">
    <span></span><span class="col">Saving</span><span class="col">Saved</span><span class="col">Error</span>
    <span class="row">Save status</span>
    <div class="save-status" data-state="saving"><span class="save-status__text" data-for="saving"><i class="icon" data-icon="circle-notch"></i>Saving…</span><span class="save-status__text" data-for="saved"><i class="icon" data-icon="check"></i>Saved just now</span><span class="save-status__text" data-for="error"><i class="icon" data-icon="warning"></i>Not saved<button class="btn" data-retry>Retry</button></span></div>
    <div class="save-status" data-state="saved"><span class="save-status__text" data-for="saving"><i class="icon" data-icon="circle-notch"></i>Saving…</span><span class="save-status__text" data-for="saved"><i class="icon" data-icon="check"></i>Saved just now</span><span class="save-status__text" data-for="error"><i class="icon" data-icon="warning"></i>Not saved<button class="btn" data-retry>Retry</button></span></div>
    <div class="save-status" data-state="error"><span class="save-status__text" data-for="saving"><i class="icon" data-icon="circle-notch"></i>Saving…</span><span class="save-status__text" data-for="saved"><i class="icon" data-icon="check"></i>Saved just now</span><span class="save-status__text" data-for="error"><i class="icon" data-icon="warning"></i>Not saved<button class="btn" data-retry>Retry</button></span></div>
    <span class="row">Live: save, or let it fail and retry</span>
    <div style="grid-column: 1 / -1; display: flex; align-items: center; gap: var(--spacing-sm)">
      <button class="btn" id="save">Save</button><button class="btn" id="fail">Save offline</button>
      <div class="save-status" id="live"><span class="save-status__text" data-for="saving"><i class="icon" data-icon="circle-notch"></i>Saving…</span><span class="save-status__text" data-for="saved"><i class="icon" data-icon="check"></i>Saved just now</span><span class="save-status__text" data-for="error"><i class="icon" data-icon="warning"></i>Not saved<button class="btn" data-retry>Retry</button></span></div>
    </div>
  </div>
  <script src="../ds.js"></script>
  <script>
    // Specimen only: the page sets data-state, and owns the wording of the time.
    const live = document.getElementById("live");
    const run = (ok) => {
      live.dataset.state = "saving";
      setTimeout(() => { live.dataset.state = ok ? "saved" : "error"; }, 900);
    };
    document.getElementById("save").onclick = () => run(true);
    document.getElementById("fail").onclick = () => run(false);
    live.querySelector("[data-retry]").onclick = () => run(true);
  </script>
</body>
</html>
