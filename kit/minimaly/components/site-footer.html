<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Site footer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../ds.css">
  <link rel="stylesheet" href="../../playground/specimen.css">
</head>
<body>
  <div class="specimen" style="grid-template-columns: minmax(0, 1fr)">
    <span class="row">Brand, three columns, legal line · one link hovered</span>
    <footer class="site-footer">
      <div class="site-footer__brand"><span class="site-footer__name"><span class="avatar" aria-hidden="true" style="border-radius: var(--radius-sm)">A</span>Atlas</span><p>Lend it, track it, get it back.</p></div>
      <nav class="site-footer__col" aria-label="Product"><h3 class="site-footer__title">Product</h3><a class="site-footer__link" href="#">Features</a><a class="site-footer__link" href="#" data-force="hover">Pricing</a><a class="site-footer__link" href="#">Changelog</a></nav>
      <nav class="site-footer__col" aria-label="Company"><h3 class="site-footer__title">Company</h3><a class="site-footer__link" href="#">About</a><a class="site-footer__link" href="#">Careers</a><a class="site-footer__link" href="#">Contact</a></nav>
      <nav class="site-footer__col" aria-label="Legal"><h3 class="site-footer__title">Legal</h3><a class="site-footer__link" href="#">Privacy</a><a class="site-footer__link" href="#">Terms</a></nav>
      <p class="site-footer__legal">© 2026 Atlas. All rights reserved.</p>
    </footer>
  </div>
  <script src="../ds.js"></script>
</body>
</html>
