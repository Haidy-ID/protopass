<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Button group</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../ds.css">
  <link rel="stylesheet" href="../../playground/specimen.css">
</head>
<body>
  <div class="specimen" style="--cols: 4">
    <span></span><span class="col">Default</span><span class="col">Hover</span><span class="col">Pressed</span><span class="col">Disabled</span>
    <span class="row">Default</span>
    <span class="btn-group" role="group" aria-label="Export"><button class="btn"><i class="icon" data-icon="download-simple"></i>Download</button><button class="btn" data-variant="icon" aria-label="Copy"><i class="icon" data-icon="copy"></i></button></span><span class="btn-group" role="group" aria-label="Export"><button class="btn" data-force="hover"><i class="icon" data-icon="download-simple"></i>Download</button><button class="btn" data-variant="icon" aria-label="Copy"><i class="icon" data-icon="copy"></i></button></span><span class="btn-group" role="group" aria-label="Export"><button class="btn"><i class="icon" data-icon="download-simple"></i>Download</button><button class="btn" data-variant="icon" aria-label="Copy" aria-pressed="true"><i class="icon" data-icon="copy"></i></button></span><span class="btn-group" role="group" aria-label="Export"><button class="btn" disabled><i class="icon" data-icon="download-simple"></i>Download</button><button class="btn" data-variant="icon" aria-label="Copy" disabled><i class="icon" data-icon="copy"></i></button></span>
    <span class="row">Primary</span>
    <span class="btn-group" role="group" aria-label="Export" data-variant="primary"><button class="btn"><i class="icon" data-icon="download-simple"></i>Download</button><button class="btn" data-variant="icon" aria-label="Copy"><i class="icon" data-icon="copy"></i></button></span><span class="btn-group" role="group" aria-label="Export" data-variant="primary"><button class="btn"><i class="icon" data-icon="download-simple"></i>Download</button><button class="btn" data-variant="icon" aria-label="Copy" data-force="hover"><i class="icon" data-icon="copy"></i></button></span><span class="btn-group" role="group" aria-label="Export" data-variant="primary"><button class="btn"><i class="icon" data-icon="download-simple"></i>Download</button><button class="btn" data-variant="icon" aria-label="Copy"><i class="icon" data-icon="copy"></i></button></span><span class="btn-group" role="group" aria-label="Export" data-variant="primary"><button class="btn" disabled><i class="icon" data-icon="download-simple"></i>Download</button><button class="btn" data-variant="icon" aria-label="Copy" disabled><i class="icon" data-icon="copy"></i></button></span>
    <span class="row">Three</span>
    <span class="btn-group" role="group" aria-label="Export"><button class="btn"><i class="icon" data-icon="download-simple"></i>Download</button><button class="btn" data-variant="icon" aria-label="Copy"><i class="icon" data-icon="copy"></i></button><button class="btn" data-variant="icon" aria-label="More"><i class="icon" data-icon="dots-three"></i></button></span><span class="btn-group" role="group" aria-label="Export"><button class="btn" data-force="hover"><i class="icon" data-icon="download-simple"></i>Download</button><button class="btn" data-variant="icon" aria-label="Copy" data-force="hover"><i class="icon" data-icon="copy"></i></button><button class="btn" data-variant="icon" aria-label="More" data-force="hover"><i class="icon" data-icon="dots-three"></i></button></span><span class="btn-group" role="group" aria-label="Export"><button class="btn"><i class="icon" data-icon="download-simple"></i>Download</button><button class="btn" data-variant="icon" aria-label="Copy"><i class="icon" data-icon="copy"></i></button><button class="btn" data-variant="icon" aria-label="More"><i class="icon" data-icon="dots-three"></i></button></span><span class="btn-group" role="group" aria-label="Export"><button class="btn" disabled><i class="icon" data-icon="download-simple"></i>Download</button><button class="btn" data-variant="icon" aria-label="Copy" disabled><i class="icon" data-icon="copy"></i></button><button class="btn" data-variant="icon" aria-label="More" disabled><i class="icon" data-icon="dots-three"></i></button></span>
    <span class="row">Copy (click it)</span>
    <span class="btn-group" role="group" aria-label="Export"><button class="btn" data-busy="Preparing" data-done="Downloaded" data-error="Try again"><i class="icon" data-icon="download-simple"></i>Download</button><button class="btn" data-variant="icon" data-copy="# Notes" aria-label="Copy the Markdown"><i class="icon" data-icon="copy"></i></button></span><span></span><span></span><span></span>
  </div>
  <script src="../ds.js"></script>
</body>
</html>
