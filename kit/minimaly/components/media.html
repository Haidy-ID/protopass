<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Media</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../ds.css">
  <link rel="stylesheet" href="../../playground/specimen.css">
</head>
<body>
  <div class="specimen" style="--cols: 2">
    <span></span><span class="col">16 / 10, with caption</span><span class="col">4 / 5</span>
    <span class="row">Media</span>
    <figure class="media" style="width: 340px"><div class="media__frame" aria-hidden="true"><i class="icon" data-icon="image" style="--icon-size: 32px"></i></div><figcaption class="media__caption">The sync screen: local notes wait in a calm grey, not in red.</figcaption></figure>
    <figure class="media" style="width: 200px; --ratio: 4 / 5"><div class="media__frame" aria-hidden="true"><i class="icon" data-icon="user" style="--icon-size: 32px"></i></div></figure>
    <span class="row">Overlay, plain and with data-blur · action on the picture</span>
    <figure class="media" style="width: 340px"><div class="media__frame"><img src="media-sample.svg" alt="Hills under a pale sun"><button class="media__action" aria-label="Save" aria-pressed="false"><i class="icon" data-icon="bookmark-simple"></i></button><div class="media__overlay"><strong>Sync, without the noise</strong><span>Local notes wait in a calm grey.</span></div></div></figure>
    <figure class="media" style="width: 340px"><div class="media__frame"><img src="media-sample.svg" alt="Hills under a pale sun"><button class="media__action" aria-label="Save" aria-pressed="true"><i class="icon" data-icon="bookmark-simple"></i></button><div class="media__overlay" data-blur><strong>Sync, without the noise</strong><span>Local notes wait in a calm grey.</span></div></div></figure>
    <span class="row">Overlay on a photo · action hover</span>
    <figure class="media" style="width: 340px"><div class="media__frame"><img src="avatar-sample.jpg" alt="Portrait"><button class="media__action" aria-label="Save" data-force="hover"><i class="icon" data-icon="bookmark-simple"></i></button><div class="media__overlay"><strong>Sync, without the noise</strong><span>Local notes wait in a calm grey.</span></div></div></figure>
    <figure class="media" style="width: 340px"><div class="media__frame"><img src="avatar-sample.jpg" alt="Portrait"><div class="media__overlay" data-blur><strong>Sync, without the noise</strong><span>Local notes wait in a calm grey.</span></div></div></figure>
  </div>
  <script src="../ds.js"></script>
</body>
</html>
