<!doctype html>
<!-- Reader for a Markdown deliverable of a topic: doc.html?topic=<topic folder from the root>&file=<file in the topic>.
     [label](screen:<id>) or [label](screen:<id>:<state>) opens that screen in the topic's prototype.
     ![caption](screen:<id>:<state>) on its own line embeds it, live, at its design size. A screen of another topic is
     written with the folder of that topic, from this one: screen:../<topic>/<id>:<state>. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="viewer.css">
</head>
<body class="landing">
  <header class="topbar"><span class="topbar__start"><a class="brand" id="brand" href="../" data-tip="Back to home"></a><nav class="breadcrumb" aria-label="Breadcrumb"><span class="breadcrumb__sep">/</span><a id="crumb-topic"></a><span class="breadcrumb__sep">/</span><span aria-current="page" id="crumb-doc"></span></nav></span></header>
  <main class="page"><article class="md md--doc" id="doc"></article></main>
  <script src="markdown.js"></script>
  <script>
    (async () => {
      const KIT = new URL(".", location.href);
      const ROOT = new URL("..", KIT);
      const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      const get = (url) => fetch(url, { cache: "no-store" });
      const params = new URLSearchParams(location.search);
      const topicUrl = new URL(params.get("topic") || "", ROOT);
      const fileUrl = new URL(params.get("file") || "", topicUrl);
      // Only files of this site, inside the topic folder.
      if (!topicUrl.href.startsWith(ROOT.href) || !fileUrl.href.startsWith(topicUrl.href)) throw new Error("This document is outside the topic.");
      const [site, topic, text] = await Promise.all([
        get(new URL("protopass.json", ROOT)).then((r) => r.json()),
        get(new URL("topic.json", topicUrl)).then((r) => r.json()),
        get(fileUrl).then((r) => (r.ok ? r.text() : Promise.reject(new Error(`${params.get("file")} not found.`)))),
      ]);
      document.head.append(Object.assign(document.createElement("link"), { rel: "icon", href: new URL("favicon.svg", KIT) }));
      document.getElementById("brand").innerHTML = `<i class="brand__mark"></i><b>Protopass</b>`;
      const crumb = document.getElementById("crumb-topic");
      crumb.href = topicUrl;
      crumb.textContent = topic.title;
      const name = topic.deliverables?.find((d) => d.file === params.get("file"))?.name || params.get("file");
      document.getElementById("crumb-doc").textContent = name;
      document.title = `${name} · ${topic.title}`;
      // A screen reference: [<folder of another topic>/]<id>[:<state>]. The topics it names are read before the document renders.
      const stateId = (label) => label.toLowerCase().replace(/[^a-z0-9]+/g, "-");
      const parseRef = (ref) => {
        const m = ref.match(/^((?:[\w.-]+\/)*)([\w-]+)(?::([\w-]+))?$/);
        return m && { folder: m[1], id: m[2], state: m[3] || "" };
      };
      const topics = new Map([["", { url: topicUrl, topic }]]);
      const folders = new Set([...text.matchAll(/\(screen:((?:[\w.-]+\/)+)[\w-]+(?::[\w-]+)?\)/g)].map((m) => m[1]));
      await Promise.all([...folders].map(async (folder) => {
        const url = new URL(folder, topicUrl);
        // Only topics of this site.
        if (!url.href.startsWith(ROOT.href)) return;
        const other = await get(new URL("topic.json", url)).then((r) => (r.ok ? r.json() : null)).catch(() => null);
        if (other) topics.set(folder, { url, topic: other });
      }));
      const find = (ref) => {
        const r = parseRef(ref);
        const t = r && topics.get(r.folder);
        const s = t?.topic.screens?.find((x) => x.id === r.id);
        const state = s && r.state ? (s.states || []).map((st) => st.name ?? st).find((name) => stateId(name) === r.state) : "";
        return s && (!r.state || state) ? { ...r, t, s, stateName: state } : null;
      };
      const prototypeUrl = (f) => `${f.t.url}?view=prototype&flow=all&at=${encodeURIComponent(`${f.id}:${f.state}`)}`;
      // screen:<ref> → the topic's prototype on that screen; other relative links resolve from the document.
      const link = (href) => {
        if (href.startsWith("screen:")) { const f = find(href.slice(7)); return f ? prototypeUrl(f) : null; }
        return /^https?:/i.test(href) ? href : new URL(href, fileUrl).href;
      };
      // An embedded screen plays in a frame of the viewport of its topic.
      const screen = (ref) => {
        const f = find(ref);
        if (!f) return null;
        const { width, height } = f.t.topic.viewport || { width: 390, height: 780 };
        return { src: new URL(`${f.s.file}${f.state ? `?state=${f.state}` : ""}`, f.t.url).href, width, height, href: prototypeUrl(f), label: f.stateName ? `${f.s.label} · ${f.stateName}` : f.s.label };
      };
      const doc = document.getElementById("doc");
      doc.innerHTML = renderMarkdown(text, { link, screen });
      // A frame keeps the size its screen was designed at and is scaled down to the room its row leaves it.
      const fit = new ResizeObserver((entries) => entries.forEach(({ target }) => {
        target.style.setProperty("--screen-scale", Math.min(1, target.clientWidth / parseFloat(getComputedStyle(target).getPropertyValue("--screen-w"))));
      }));
      doc.querySelectorAll(".md-screen__frame").forEach((frame) => fit.observe(frame));
      // The theme chosen on the topic pages, for the reader and its figures (they read html[data-theme], like screens).
      let theme = "light";
      try { theme = localStorage.getItem("protopass-theme") || theme; } catch {}
      document.documentElement.dataset.theme = theme;
      const themeFigure = (frame) => { try { frame.contentDocument.documentElement.dataset.theme = theme; } catch {} };
      document.querySelectorAll(".md-figure iframe").forEach((frame) => { themeFigure(frame); frame.addEventListener("load", () => themeFigure(frame)); });
      window.renderIcons?.();
    })().catch((e) => { document.getElementById("doc").textContent = e.message; });
  </script>
  <script src="minimaly/ds.js"></script>
  <script src="live.js"></script>
</body>
</html>
