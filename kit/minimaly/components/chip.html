<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Chip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../ds.css">
  <link rel="stylesheet" href="../../playground/specimen.css">
</head>
<body>
  <div class="specimen" style="--cols: 4">
    <span></span><span class="col">default</span><span class="col">round</span><span class="col">accent</span><span class="col">muted</span>
    <span class="row">Chip</span>
    <span class="chip"><i class="icon" data-icon="folder"></i>Atlas</span><span class="chip" data-variant="round">v2.1</span><span class="chip" data-variant="accent"><i class="icon" data-icon="paperclip"></i>brief.pdf</span><span class="chip" data-variant="muted"><i class="icon" data-icon="calendar-blank"></i>No date</span>
    <span class="row">Muted among set values: the changed one draws the eye</span>
    <div style="display: flex; gap: var(--spacing-xs); grid-column: 1 / -1"><span class="chip" data-variant="muted"><i class="icon" data-icon="user"></i>No owner</span><span class="chip"><i class="icon" data-icon="flag"></i>High</span><span class="chip" data-variant="muted"><i class="icon" data-icon="calendar-blank"></i>No date</span><span class="chip" data-variant="muted"><i class="icon" data-icon="tag"></i>No label</span></div>
  </div>
  <script src="../ds.js"></script>
</body>
</html>
