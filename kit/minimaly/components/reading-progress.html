<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Reading progress</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../ds.css">
  <link rel="stylesheet" href="../../playground/specimen.css">
</head>
<body>
  <div class="specimen" style="--cols: 3">
    <span></span><span class="col">Start</span><span class="col">Halfway</span><span class="col">Read</span>
    <span class="row">Reading progress</span>
    <div class="reading-progress" role="progressbar" aria-label="Reading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" style="--read: 0; width: 200px"><span class="reading-progress__fill"></span></div>
    <div class="reading-progress" role="progressbar" aria-label="Reading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" style="--read: 0.5; width: 200px"><span class="reading-progress__fill"></span></div>
    <div class="reading-progress" role="progressbar" aria-label="Reading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" style="--read: 1; width: 200px"><span class="reading-progress__fill"></span></div>
  </div>
  <script src="../ds.js"></script>
</body>
</html>
