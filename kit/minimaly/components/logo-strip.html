<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Logo strip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../ds.css">
  <link rel="stylesheet" href="../../playground/specimen.css">
</head>
<body>
  <div class="specimen" style="grid-template-columns: minmax(0, 1fr)">
    <span class="row">Default</span>
    <div class="logo-strip"><p class="logo-strip__label">Trusted by teams at</p><ul class="logo-strip__logos"><li><img src="../icons/bold/hexagon-bold.svg" alt="">Hexa</li><li><img src="../icons/bold/planet-bold.svg" alt="">Orbit</li><li><img src="../icons/bold/lightning-bold.svg" alt="">Volt</li><li><img src="../icons/bold/leaf-bold.svg" alt="">Fern</li><li><img src="../icons/bold/cube-bold.svg" alt="">Cubic</li><li><img src="../icons/bold/wave-sine-bold.svg" alt="">Tide</li></ul></div>
    <span class="row">Centered</span>
    <div class="logo-strip" data-variant="centered"><p class="logo-strip__label">Trusted by teams at</p><ul class="logo-strip__logos"><li><img src="../icons/bold/hexagon-bold.svg" alt="">Hexa</li><li><img src="../icons/bold/planet-bold.svg" alt="">Orbit</li><li><img src="../icons/bold/lightning-bold.svg" alt="">Volt</li><li><img src="../icons/bold/leaf-bold.svg" alt="">Fern</li><li><img src="../icons/bold/cube-bold.svg" alt="">Cubic</li><li><img src="../icons/bold/wave-sine-bold.svg" alt="">Tide</li></ul></div>
  </div>
  <script src="../ds.js"></script>
</body>
</html>
